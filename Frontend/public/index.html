<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d0d0d" />

    <!-- Favicons (Google SERP uses these to render the site logo) -->
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png" />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Primary SEO -->
    <title>BrandSetu Digital — Digital Marketing &amp; SEO Agency in Indore</title>
    <meta
      name="description"
      content="BrandSetu Digital is a top digital marketing agency in Indore offering SEO, branding, social media marketing, web development, and performance ads to help businesses grow online."
    />
    <meta
      name="keywords"
      content="digital marketing agency Indore, SEO services Indore, branding agency Indore, social media marketing, web development, performance marketing, BrandSetu, BrandSetu Digital"
    />
    <meta name="author" content="BrandSetu Digital" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://brandsetudigital.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BrandSetu Digital" />
    <meta property="og:url" content="https://brandsetudigital.com/" />
    <meta property="og:title" content="BrandSetu Digital — Digital Marketing &amp; SEO Agency in Indore" />

      property="og:description"
      content="Top digital marketing agency in Indore offering SEO, branding, social media marketing, web development, and performance ads."

    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

      name="twitter:description"
      content="Top digital marketing agency in Indore offering SEO, branding, social media marketing, web development, and performance ads."

    <!-- LocalBusiness JSON-LD (sitewide; per-route schemas added via react-helmet-async) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "@id": "https://brandsetudigital.com/#organization",
        "name": "BrandSetu Digital",
        "url": "https://brandsetudigital.com/",
        "logo": "https://brandsetudigital.com/logo512.png",
        "image": "https://brandsetudigital.com/logo512.png",
        "description": "BrandSetu Digital is a digital marketing agency in Indore offering SEO, branding, social media marketing, web development, and performance ads.",
        "email": "Brandsetudigital@gmail.com",
        "telephone": "+91-6232363639",
        "priceRange": "₹₹",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Indore",
          "addressRegion": "Madhya Pradesh",
          "addressCountry": "IN"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 22.7196,
          "longitude": 75.8577
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
            "opens": "10:00",
            "closes": "19:00"
          }
        ],
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Digital Marketing Services",
          "itemListElement": [
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "SEO Services" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Branding & Brand Strategy" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Social Media Marketing" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Web Design & Development" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Performance Marketing" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Content, Shoots & Editing" } }
          ]
        },
        "sameAs": [
          "https://www.linkedin.com",
          "https://www.instagram.com/brandsetudigital",
          "https://www.facebook.com/share/1GsguCpjJq/"
